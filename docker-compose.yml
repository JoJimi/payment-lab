services:
  # 2.2: 서비스별 DB 분리 (README 방침 — Order/Payment는 각자 별도 DB, Inventory/Notification은
  # 같은 DB를 공유). 로컬 16GB RAM 예산 안에서 인스턴스 3개를 유지하려고 max_connections/
  # shared_buffers를 줄였다(부록 B, saga 프로파일 "PG 2인스턴스(+)"에 맞춘 추가 배치).
  #
  # DB_USERNAME/DB_PASSWORD는 기본값 없이 필수로 요구한다 — 커밋된 평문 자격증명을 남기지
  # 않기 위함. `cp .env.example .env`로 로컬 값을 채운 뒤 실행할 것(.env.example 참고).
  postgres-order:
    image: postgres:16-alpine
    container_name: payment-lab-postgres-order
    environment:
      POSTGRES_DB: payment_lab_order
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME이 필요합니다 — .env.example을 .env로 복사하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다 — .env.example을 .env로 복사하세요}
    ports:
      - "5432:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    mem_limit: 512m
    command: >
      postgres -c max_connections=100
               -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d payment_lab_order"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: payment-lab-postgres-payment
    environment:
      POSTGRES_DB: payment_lab_payment
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME이 필요합니다 — .env.example을 .env로 복사하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다 — .env.example을 .env로 복사하세요}
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    mem_limit: 512m
    command: >
      postgres -c max_connections=100
               -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d payment_lab_payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  # inventory-service 전용이지만, README 방침상 notification-service가 엔티티를 갖게 되면
  # 같은 인스턴스(같은 DB)를 공유한다 — 지금은 notification-service에 엔티티가 없어 접속하지 않는다.
  postgres-inventory:
    image: postgres:16-alpine
    container_name: payment-lab-postgres-inventory
    environment:
      POSTGRES_DB: payment_lab_inventory
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME이 필요합니다 — .env.example을 .env로 복사하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요합니다 — .env.example을 .env로 복사하세요}
    ports:
      - "5434:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    mem_limit: 512m
    command: >
      postgres -c max_connections=100
               -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d payment_lab_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-lab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2.5: Kafka(KRaft 모드, 단일 브로커). Zookeeper 없이 같은 프로세스가 브로커+컨트롤러
  # 역할을 겸한다(부록 B "saga" 프로파일 예산에 맞춘 최소 구성). 서비스들은 컨테이너 밖에서
  # `./gradlew :xxx-service:bootRun`으로 직접 뜨는 구조라(다른 인프라와 동일 패턴),
  # 호스트에서 접속 가능한 PLAINTEXT_HOST 리스너를 따로 노출한다.
  #
  # 테스트(Testcontainers)는 이 compose 서비스와 무관하게 자체 컨테이너를 띄운다 — 여기는
  # 로컬 수동 개발용이라 CI에서 검증되지 않는다.
  kafka:
    image: apache/kafka:3.8.0
    container_name: payment-lab-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_order_data:
  postgres_payment_data:
  postgres_inventory_data:
