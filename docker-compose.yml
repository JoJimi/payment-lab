services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-lab-postgres
    environment:
      POSTGRES_DB: payment_lab_dev
      POSTGRES_USER: cs
      POSTGRES_PASSWORD: cs123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g
    command: >
      postgres -c max_connections=200 
               -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs -d payment_lab_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-lab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
