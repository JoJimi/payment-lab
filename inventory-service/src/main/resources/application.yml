spring:
  application:
    name: inventory-service

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      timeout: 3000
      repositories:
        enabled: false

# 1.11: 재고 차감 락 전략 스위치. NONE(대조군) / PESSIMISTIC / OPTIMISTIC / DISTRIBUTED.
# 전환은 재기동 필요 — "한 번에 한 개념만 켠다" 원칙상 런타임 핫스위치는 만들지 않았다.
inventory:
  lock-strategy: OPTIMISTIC
  optimistic-lock:
    max-retries: 3 # 1.14에서 1/3/5/10으로 바꿔가며 측정

server:
  port: 8083
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    org.example: DEBUG
