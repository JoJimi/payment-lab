spring:
  datasource:
    # 2.2: inventory-service 전용 DB (docker-compose.yml의 postgres-inventory, 호스트 포트 5434).
    # 로드맵 방침상 notification-service가 엔티티를 갖게 되면 이 DB를 공유하게 된다 — 지금은
    # notification-service에 영속 대상이 없어 접속하지 않는다.
    url: jdbc:postgresql://localhost:5434/payment_lab_inventory
    username: ${DB_USERNAME:cs}
    password: ${DB_PASSWORD:cs123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: inventory-service
        environment: dev
  file:
    name: logs/inventory-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
