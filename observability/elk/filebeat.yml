# 4.3 — 4개 서비스가 0.5에서부터 찍고 있는 ECS JSON 파일을 그대로 payment-logs 데이터
# 스트림(4.2)에 적재한다.
#
# `./gradlew :xxx-service:bootRun`을 레포 루트에서 실행하면 working directory가 루트가
# 되어, 각 서비스 application-dev.yml의 `logging.file.name: logs/<service>.json`(상대
# 경로)이 서비스별 디렉터리가 아니라 레포 루트의 ./logs/ 한 곳에 4개 파일로 모인다
# (docker-compose.elk.yml 참고 — 처음엔 서비스별 디렉터리를 마운트했다가 로그가 전혀
# 안 잡혀서 뒤늦게 발견한 조용한 실패). 그래서 입력도 하나로 합쳐서 /logs/*.json을 그대로
# 본다 — 어차피 service.name은 각 로그 안(ECS)에 이미 들어있어서 파일명으로 서비스를
# 구분할 필요가 없다.
#
# ndjson 파서로 한 줄 = JSON 객체 한 건을 그대로 파싱해서 루트에 올린다(target: "") —
# Boot 내장 ECS 인코더가 이미 @timestamp/log.level/service.name 등을 표준 ECS 구조로
# 내보내므로 별도 필드 변환이 필요 없다. overwrite_keys를 켜서 파일 안의 실제 로그 시각
# (@timestamp)이 Filebeat의 수집 시각을 덮어쓰게 한다.
filebeat.inputs:
  - type: filestream
    id: payment-lab-logs
    paths:
      - /logs/*.json
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true

# 템플릿/ILM은 4.2에서 scripts/setup-elk.sh로 이미 만들어뒀다 — Filebeat 자체 기본
# 템플릿으로 덮어쓰지 않게 끈다. Kibana 대시보드 자동 로드(setup.dashboards)도
# 이 프로젝트에선 4.5에서 수동으로 만들 것이라 끈다.
setup.template.enabled: false
setup.ilm.enabled: false
setup.dashboards.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # payment-logs는 이미 데이터 스트림으로 존재한다(4.2) — 이 이름으로 쓰면 일반 인덱스가
  # 아니라 데이터 스트림 append로 처리된다.
  index: "payment-logs"

logging.level: info
