global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'payment-lab'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 앱은 컨테이너 밖(호스트)에서 ./gradlew bootRun으로 뜬다.
      # host.docker.internal은 docker-compose.observability.yml의 extra_hosts로 리눅스에서도 동작.
      - targets: ['host.docker.internal:8080']
