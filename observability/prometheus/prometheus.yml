global:
  scrape_interval: 5s

# 2.1: 서비스가 4개 프로세스로 분리되면서 포트도 나뉘었다(order-service/build.gradle.kts 등
# 각 서비스 application.yml server.port 참고). 서비스는 컨테이너 밖(호스트)에서
# ./gradlew :<module>:bootRun 으로 뜬다. host.docker.internal은
# docker-compose.observability.yml의 extra_hosts로 리눅스에서도 동작.
scrape_configs:
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
