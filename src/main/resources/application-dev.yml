spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_lab_dev
    username: cs
    password: cs123
    hikari:
      # ── 벤치마크의 숨은 변수 ──
      # 1.12 는 "재고 100개에 동시 요청 300건"인데 풀이 20이면
      # 동시에 DB를 만지는 건 20개뿐이고 나머지 280개는 커넥션을 기다림.
      # → p95 에 잡히는 시간의 상당 부분이 락 경합이 아니라 "풀 대기"가 됨.
      # → 비관적/낙관적 락의 차이가 풀 대기에 묻혀 "둘이 비슷하다"는 오답이 나옴.
      #
      # TODO(1.13): 이 값을 10 / 20 / 50 으로 바꿔가며 곡선을 함께 기록할 것.
      #             측정표 상단에 이 값을 환경 정보로 반드시 명시.
      # TODO(3.9): "방어 없으면 커넥션 풀 고갈로 전체가 멈춘다"를 재현할 때
      #             이 값이 실험의 핵심 변수가 됨. 풀 20 + PG 응답 5초면
      #             21번째 요청부터 줄을 섬.
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리. Hibernate는 엔티티와 실제 테이블이 맞는지 검증만.
      # update 를 쓰면 Flyway가 안 돌아도 Hibernate가 테이블을 만들어버려서
      # "Flyway가 실행되지 않은 상태"를 알아채지 못함 (Boot 4의 대표적 조용한 실패).
      ddl-auto: validate

    # false 로 둔 이유: show-sql 은 로깅 프레임워크를 거치지 않고 System.out 에 직접 씀.
    # → JSON 로그 라인들 사이에 생 SQL 텍스트가 섞여 들어가고,
    #   4단계에서 Filebeat가 그 줄들의 JSON 파싱에 실패함.
    # SQL은 아래 org.hibernate.SQL 로거로만 출력 (중복 출력도 방지).
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      # dev 전용. 운영에서는 내부 구조가 노출되므로 never 또는 when-authorized.
      show-details: always

  health:
    # 4단계 전까지 ES 컨테이너가 없어서 localhost:9200 연결 실패 →
    # /actuator/health 가 DOWN(503)이 됨. 다른 문제의 신호를 가려버리므로 비활성.
    # TODO(4.1): ES 컨테이너를 띄우면 이 줄을 제거할 것.
    elasticsearch:
      enabled: false

logging:
  structured:
    format:
      # 파일에만 JSON 콘솔은 Boot 기본 컬러 패턴 유지
      file: ecs
    ecs:
      service:
        name: payment-lab
        environment: dev
  file:
    name: logs/payment-lab.json
  level:
    org.hibernate.SQL: DEBUG           # 실행된 SQL 문
    org.hibernate.orm.jdbc.bind: TRACE # 바인딩된 파라미터 값 (?에 들어간 실제 값)
    # 마이그레이션이 실제로 실행됐는지 확인용.
    # 다만 최종 확인은 로그가 아니라 반드시 테이블로 할 것:
    #   select * from flyway_schema_history;
    org.flywaydb: DEBUG