rules:
  - id: no-floating-point-money
    languages: [java]
    severity: ERROR
    message: >-
      금액에 부동소수점을 쓰면 반올림 오차가 누적됩니다. BigDecimal을 사용하세요.
      (CLAUDE.md 코드 규칙, docs/roadmap.md 1.3)
    pattern-either:
      - pattern: double $AMOUNT = ...;
      - pattern: float $AMOUNT = ...;
    paths:
      include:
        - "**/payment/**"
        - "**/order/**"

# 2.10: no-direct-kafka-send 룰(Outbox 우회 방지)은 outbox-required.yml에 추가함.
