spring:
  datasource:
    # 2.1: 아직 payment-service만의 DB로 분리되지 않은 과도기 상태 — 모놀리식 시절과 같은
    # payment_lab_dev를 공유한다. 실제 분리는 2.2(서비스별 DB 분리)에서 진행.
    url: jdbc:postgresql://localhost:5432/payment_lab_dev
    username: ${DB_USERNAME:cs}
    password: ${DB_PASSWORD:cs123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: payment-service
        environment: dev
  file:
    name: logs/payment-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
