spring:
  datasource:
    # 2.2: payment-service 전용 DB (docker-compose.yml의 postgres-payment, 호스트 포트 5433).
    url: jdbc:postgresql://localhost:5433/payment_lab_payment
    username: ${DB_USERNAME:cs}
    password: ${DB_PASSWORD:cs123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: payment-service
        environment: dev
  file:
    name: logs/payment-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
