spring:
  datasource:
    # 2.2: payment-service 전용 DB (docker-compose.yml의 postgres-payment, 호스트 포트 5433).
    url: jdbc:postgresql://localhost:5433/payment_lab_payment
    # 기본값 없이 필수로 요구한다 — 커밋된 평문 자격증명을 남기지 않기 위함.
    # `cp .env.example .env` 후 `export $(grep -v '^#' .env | xargs)`로 셸에 내보낼 것.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: payment-service
        environment: dev
  file:
    name: logs/payment-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
