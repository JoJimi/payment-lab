spring:
  application:
    name: payment-service

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      timeout: 3000
      repositories:
        enabled: false

# 1.5: 별도 프로세스로 기동하는 Mock PG (mock-pg-server 모듈). 3단계에서 Resilience4j 인스턴스명
# mockPg와 맞물리므로 이름을 미리 고정해둔다.
mockpg:
  base-url: http://localhost:8090

server:
  port: 8082
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    instances:
      mockPg:
        # false: 서킷 OPEN이 /actuator/health를 DOWN으로 만들지 않게 한다.
        # 5단계 readiness probe에서 외부 장애 때 파드가 빠지는 걸 방지 (3단계 목표와 반대 방향).
        register-health-indicator: false
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # BulkheadFullException(3.5)은 우리 쪽 스레드풀 용량이 찼다는 뜻이지 PG가 응답을
        # 못 준다는 증거가 아니다 — 부하가 몰려 거부가 늘어도 실제 PG 상태와 무관하게 서킷이
        # 열리면 안 되므로 실패 집계에서 뺀다(CodeRabbit 리뷰, PR #89). 카드 거절이 CB에
        # 안 잡히는 것(3.2)과 같은 이유다.
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException

  retry:
    instances:
      mockPg:
        max-attempts: 3
        wait-duration: 500ms
        # 지수 백오프: 500ms -> 1000ms. 여러 인스턴스가 동시에 장애를 겪어도 재시도가
        # 한 타이밍에 몰려 부하를 더 키우지 않도록 매 대기시간에 ±50% 무작위 지터를 얹는다.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # 카드 거절 등 정상 비즈니스 실패는 예외 없이 정상 반환되므로 애초에 재시도 대상이
        # 아니다(3.2). 기술적 실패(MockPgUnavailableException)만 재시도하고, 서킷이 이미
        # 열려 원본 호출조차 못 간 CallNotPermittedException은 재시도해도 똑같이 거부될
        # 뿐이라 재시도 목록에서 뺀다 — 3.1 실험 2가 증명한 것과 같은 이유다.
        retry-exceptions:
          - org.example.cs_study.payment.client.MockPgUnavailableException

  timelimiter:
    instances:
      mockPg:
        timeout-duration: 3s

  thread-pool-bulkhead:
    instances:
      mockPg:
        # PG 호출 전용 스레드풀을 무제한 newCachedThreadPool(3.4)에서 이걸로 교체한다(3.5).
        # core/max를 좁게 잡아 PG가 느려져도 이 스레드풀이 다른 작업의 자원을 다 잡아먹지
        # 못하게 막고, core를 넘는 요청은 큐(queue-capacity)에서 잠깐 기다리게 하되 그마저
        # 넘치면 BulkheadFullException으로 즉시 거부해 대기 자체를 없앤다.
        core-thread-pool-size: 4
        max-thread-pool-size: 8
        queue-capacity: 8
        keep-alive-duration: 20ms

logging:
  level:
    root: INFO
    org.example: DEBUG
