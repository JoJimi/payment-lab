spring:
  datasource:
    # 2.2: order-service 전용 DB (docker-compose.yml의 postgres-order, 호스트 포트 5432).
    url: jdbc:postgresql://localhost:5432/payment_lab_order
    # 기본값 없이 필수로 요구한다 — 커밋된 평문 자격증명을 남기지 않기 위함.
    # `cp .env.example .env` 후 `set -a && source ./.env && set +a`로 셸에 내보낼 것.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리. Hibernate는 엔티티와 실제 테이블이 맞는지 검증만.
      ddl-auto: validate
    show-sql: false

  # 2.8: outbox 릴레이(OutboxRelay)가 이 브로커로 발행한다(2.5의 docker-compose Kafka,
  # PLAINTEXT_HOST 리스너 — 서비스가 컨테이너 밖에서 직접 뜨는 기존 패턴과 동일).
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: order-service
        environment: dev
  file:
    name: logs/order-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
