spring:
  datasource:
    # 2.2: order-service 전용 DB (docker-compose.yml의 postgres-order, 호스트 포트 5432).
    url: jdbc:postgresql://localhost:5432/payment_lab_order
    username: ${DB_USERNAME:cs}
    password: ${DB_PASSWORD:cs123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리. Hibernate는 엔티티와 실제 테이블이 맞는지 검증만.
      ddl-auto: validate
    show-sql: false

management:
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: order-service
        environment: dev
  file:
    name: logs/order-service.json
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG
